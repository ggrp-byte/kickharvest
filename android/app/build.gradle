plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kickminer.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.kickminer.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.1-mobile"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
